[project]
name = "saarthi-ai"
version = "0.1.0"
description = "Local foundation for the Saarthi security-specialized AI assistant"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi[standard]>=0.115",
  "httpx>=0.28",
  "ollama>=0.6",
  "pydantic-settings>=2.7",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
saarthi = "saarthi_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saarthi_ai"]

[tool.hatch.build.targets.sdist]
include = [
  "src/saarthi_ai",
  "pyproject.toml",
  "README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
