[project]
name = "saarthi2"
version = "0.1.0"
description = "Saarthi 2.0 — a local-first, AI-native security workflow orchestration engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "ollama>=0.4",
    "typer>=0.15",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "redis>=5.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
saarthi2 = "saarthi2.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saarthi2"]
# Bundle the default workflow library and the Web UI with the package.
artifacts = [
    "src/saarthi2/workflows/*.yaml",
    "src/saarthi2/server/static/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
