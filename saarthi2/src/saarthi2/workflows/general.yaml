name: general
description: >
  Full recon → normalize → probe → scan → AI triage. Shows tool adapters,
  parallel branches, and data functions. Requires the referenced tools on PATH.

vars:
  target: example.com
  workdir: "~/.saarthi2/loot/{{ target }}"

steps:
  - id: prep
    name: Create loot folder
    uses: function
    with:
      func: create_folder
      path: "{{ vars.workdir }}"

  # Discover subdomains from several sources at once.
  - id: discover
    name: Subdomain discovery (parallel)
    uses: parallel
    with:
      steps:
        - id: subfinder
          uses: tool
          with: { tool: subfinder, target: "{{ target }}" }
          register: subfinder
        - id: assetfinder
          uses: tool
          continue_on_error: true
          with: { tool: assetfinder, target: "{{ target }}" }
          register: assetfinder

  # Merge + unique the two sources into one host list.
  - id: merge
    name: Merge & unique subdomains
    uses: function
    with:
      func: deduplicate
      input: ""            # (in a real run, write sources to files and cat/join them)
      output: "{{ vars.workdir }}/subs.txt"

  - id: triage
    name: AI triage
    uses: llm
    with:
      max_iterations: 3
      tools: []
      prompt: |
        Authorized recon of {{ target }}.
        subfinder found:
        {{ steps.subfinder.output }}
        assetfinder found:
        {{ steps.assetfinder.output }}
        Summarize the attack surface and name the 3 most interesting hosts.
