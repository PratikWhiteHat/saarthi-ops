<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saarthi 2.0</title>
<style>
  :root {
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#f0f2f5; --border:#d8dde3;
    --fg:#1f2328; --muted:#6b7280; --accent:#2563eb; --accent-weak:#e8f0fe;
    --ai:#7c3aed; --ai-weak:#f1eafe;
    --ok:#1a7f37; --fail:#cf222e; --run:#9a6700; --skip:#6b7280;
    --shadow:0 1px 3px rgba(27,31,36,.08), 0 6px 24px rgba(27,31,36,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--fg); }
  code,pre,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .app { display:grid; grid-template-columns:230px 1fr; height:100vh; }

  /* sidebar */
  .sidebar { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:14px 10px; }
  .brand { display:flex; align-items:center; gap:8px; padding:4px 8px 14px; }
  .brand .logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#2563eb,#7c3aed); }
  .brand .name { font-weight:800; letter-spacing:.5px; }
  .brand .demo { font-size:10px; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:0 5px; }
  .navgroup { color:var(--muted); font-size:10px; letter-spacing:1.2px; text-transform:uppercase;
              margin:14px 8px 4px; }
  .nav { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; cursor:pointer;
         color:#2f3540; font-size:13px; }
  .nav .ic { width:18px; text-align:center; opacity:.7; }
  .nav:hover { background:var(--panel2); }
  .nav.active { background:var(--accent-weak); color:var(--accent); font-weight:600; }
  .nav.active .ic { opacity:1; }

  /* content */
  .content { overflow-y:auto; }
  .topbar { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; align-items:center;
            gap:12px; padding:16px 22px 10px; border-bottom:1px solid var(--border); }
  .topbar h1 { font-size:17px; margin:0; }
  .topbar .desc { color:var(--muted); font-size:12px; }
  .topbar .right { margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .view { padding:20px 22px 60px; }

  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:0 0 10px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
  .pad { padding:14px 16px; }
  .grid { display:grid; gap:14px; }
  .stat-row { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .stat .n { font-size:26px; font-weight:800; }
  .stat .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .stat.crit .n{color:var(--fail)} .stat.high .n{color:#d1242f} .stat.medium .n{color:var(--run)}
  .stat.low .n{color:var(--accent)} .stat.info .n{color:var(--muted)}
  .stat.confirmed .n{color:var(--ok)} .stat.suspected .n{color:var(--run)}

  input,button,label,select,textarea { font:inherit; }
  input[type=text],select,textarea { background:var(--panel); border:1px solid var(--border);
    color:var(--fg); border-radius:8px; padding:8px 11px; }
  input[type=text]{ flex:1; min-width:180px; }
  textarea { width:100%; resize:vertical; min-height:90px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px;
    font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  button.secondary { background:var(--panel); color:var(--fg); border:1px solid var(--border); }
  button.small { padding:4px 10px; font-size:12px; }
  label.chk { color:var(--muted); display:flex; align-items:center; gap:5px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top; word-break:break-word; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:var(--panel2); }
  .empty { color:var(--muted); font-size:13px; padding:14px 4px; }

  .badge { padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block; }
  .s-completed{ background:#e6f4ea; color:var(--ok); }
  .s-failed{ background:#fbe9e9; color:var(--fail); }
  .s-running{ background:#fdf3e0; color:var(--run); }
  .s-skipped,.s-pending{ background:var(--panel2); color:var(--muted); }
  .sev { padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block; }
  .sev-critical{ background:#fbe4e4; color:#b91c1c; } .sev-high{ background:#fdeaea; color:var(--fail); }
  .sev-medium{ background:#fbf1dd; color:var(--run); } .sev-low{ background:#e8f0fe; color:var(--accent); }
  .sev-info,.sev-unknown{ background:var(--panel2); color:var(--muted); }
  .st { padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block; }
  .st-confirmed{ background:#e6f4ea; color:var(--ok); }
  .st-suspected{ background:#fbf1dd; color:var(--run); }
  .st-dropped,.st-unknown{ background:var(--panel2); color:var(--muted); }
  .chip { background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:1px 10px;
          font-size:11px; color:var(--muted); }

  .item { padding:11px 13px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px;
          cursor:pointer; background:var(--panel); }
  .item:hover { border-color:var(--accent); }
  .item.active { border-color:var(--accent); background:var(--accent-weak); }
  .item .sub { color:var(--muted); font-size:12px; word-break:break-all; }

  #diagram { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px;
             min-height:120px; overflow:auto; box-shadow:var(--shadow); }
  .out { background:#0d1117; border:1px solid #24292f; border-radius:8px; padding:10px; color:#d7dee7;
         white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:340px; overflow:auto;
         margin:2px 0 10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .out-label { color:var(--muted); font-size:12px; margin:10px 0 3px; display:flex; align-items:center; gap:6px; }
  .link { color:var(--accent); text-decoration:none; cursor:pointer; margin-left:auto; }
  .sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:16px 0 6px; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:6px 14px; }
  .kv .k { color:var(--muted); }

  /* drawer */
  .overlay { position:fixed; inset:0; background:rgba(27,31,36,.35); opacity:0; pointer-events:none;
             transition:opacity .18s; z-index:20; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100vh; width:min(680px,92vw); background:var(--panel);
            border-left:1px solid var(--border); box-shadow:-8px 0 40px rgba(27,31,36,.18); z-index:21;
            transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer-head { display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); }
  .drawer-head .title { font-weight:700; }
  .drawer-head .x { margin-left:auto; cursor:pointer; color:var(--muted); border:1px solid var(--border);
                    border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .drawer-body { overflow-y:auto; padding:18px 20px; }
  .ai-box { background:var(--ai-weak); border:1px solid #dcc9f7; border-radius:10px; padding:12px; margin-top:12px; }
  .rep-box { background:var(--accent-weak); border:1px solid #cfe0fd; border-radius:10px; padding:12px; margin-top:12px; }
  .ai-box .h { color:var(--ai); font-weight:700; margin-bottom:6px; }
  .rep-box .h { color:var(--accent); font-weight:700; margin-bottom:6px; }
  .ai-body { white-space:pre-wrap; word-break:break-word; font-size:12.5px; margin:0; max-height:420px; overflow:auto; }

  /* LLM playground: main pane + agent side pane */
  .pg { display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start; }
  @media (max-width:1024px){ .pg { grid-template-columns:1fr; } }
  .tool-chk { display:flex; flex-wrap:wrap; gap:8px; }
  .tool-chk label { display:flex; align-items:center; gap:6px; color:var(--fg); font-size:12px;
    border:1px solid var(--border); border-radius:8px; padding:4px 9px; cursor:pointer; background:var(--panel); }
  .tool-chk label:hover { border-color:var(--accent); }
  .pg-answer { min-height:60px; }
  .pg-log { background:#0d1117; color:#d7dee7; border:1px solid #24292f; border-radius:8px; padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; white-space:pre-wrap;
    word-break:break-word; max-height:320px; overflow:auto; margin-top:8px; }
  .pg-log .ln { display:block; padding:1px 0; }
  .pg-log .ln.tool { color:#79c0ff; } .pg-log .ln.ok { color:#7ee787; } .pg-log .ln.err { color:#ff7b72; }
  .pg-log .ln.info { color:#8b949e; } .pg-log .ln.think { color:#d2a8ff; }
  .side .st-row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13px;
    border-bottom:1px solid var(--border); }
  .side .st-row:last-child { border-bottom:0; }
  .side .st-row .k { color:var(--muted); } .side .st-row .v { font-weight:600; text-align:right; word-break:break-word; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; }
  .dot.run { background:var(--run); animation:pulse 1s ease-in-out infinite; }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--fail); } .dot.idle { background:var(--muted); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .act-item { border:1px solid var(--border); border-left:3px solid var(--border); border-radius:8px;
    padding:8px 10px; margin-bottom:8px; font-size:12px; background:var(--panel); }
  .act-item.run { border-left-color:var(--run); } .act-item.ok { border-left-color:var(--ok); }
  .act-item.err { border-left-color:var(--fail); }
  .act-item .tname { font-weight:700; } .act-item .titer { color:var(--muted); font-size:11px; }
  .act-item .targs { color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:11px;
    word-break:break-all; margin-top:3px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo"></span><span class="name">Saarthi</span><span class="demo">2.0</span></div>
    <nav id="nav"></nav>
  </aside>
  <main class="content">
    <div class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="desc" id="page-desc"></div>
      </div>
      <div class="right" id="topstats"></div>
      <button id="new-scan">▷ New Scan</button>
      <button class="secondary small" id="global-refresh">↻ Refresh</button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><span class="title" id="drawer-title"></span>
    <span class="x" id="drawer-x">✕</span></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad:false, theme:'default', securityLevel:'loose' });

const $ = (id) => document.getElementById(id);
const state = { view:'dashboard', wf:null, run:null, wsFilter:'', pollTimer:null };

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;         // ONLY for engine-generated SVG
    else if (k === 'class') n.className = v;
    else if (k === 'on') n.onclick = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}
const badge = (s) => el('span', { class: 'badge s-' + (s || 'pending'), text: s || '' });
const sevPill = (s) => el('span', { class: 'sev sev-' + (s || 'info'), text: s || 'info' });
const statusPill = (s) => el('span', { class: 'st st-' + (s || 'unknown'), text: s || 'unknown' });

function renderTable(cols, rows, empty, onRow) {
  if (!rows || !rows.length) return el('div', { class: 'empty', text: empty || 'nothing here' });
  const table = el('table');
  const thr = el('tr'); for (const c of cols) thr.append(el('th', { text: c.label }));
  table.append(el('thead', null, thr));
  const tb = el('tbody');
  for (const r of rows) {
    const tr = el('tr', onRow ? { class: 'click', on: () => onRow(r) } : null);
    for (const c of cols) tr.append(c.render ? el('td', null, c.render(r)) : el('td', { text: String(r[c.key] ?? '') }));
    tb.append(tr);
  }
  table.append(tb);
  return el('div', { class: 'card' }, table);
}

// ---- navigation -----------------------------------------------------------
const NAV = [
  { group: 'Overview', items: [{ id: 'dashboard', label: 'Dashboard', ic: '▦' }] },
  { group: 'Scans', items: [{ id: 'runs', label: 'Runs', ic: '▷' }, { id: 'workflows', label: 'Workflows', ic: '⚙' }] },
  { group: 'Inventory', items: [{ id: 'findings', label: 'Findings', ic: '⚑' }, { id: 'workspaces', label: 'Workspaces', ic: '▣' }] },
  { group: 'Activity', items: [{ id: 'events', label: 'Events', ic: '≡' }] },
  { group: 'Catalog', items: [
    { id: 'cat:tools', label: 'Tools', ic: '⚒' }, { id: 'cat:functions', label: 'Functions', ic: 'ƒ' },
    { id: 'cat:subagents', label: 'Sub-agents', ic: '☰' }, { id: 'cat:cloud', label: 'Cloud & Storage', ic: '☁' },
    { id: 'cat:skills', label: 'Skills', ic: '📚' }, { id: 'cat:plugins', label: 'Plugins', ic: '⧉' }] },
  { group: 'System', items: [{ id: 'llm', label: 'LLM Playground', ic: '🧠' }, { id: 'settings', label: 'Settings', ic: '⚙' }] },
];
const TITLES = {
  dashboard: ['Dashboard', 'Overview of runs, findings, and activity'],
  runs: ['Runs', 'Every workflow run — click one for details'],
  workflows: ['Workflows', 'Pick a workflow, visualize it, and run it'],
  findings: ['Findings', 'Vulnerabilities discovered across all runs'],
  workspaces: ['Workspaces', 'Runs grouped per target'],
  events: ['Events', 'Audit log of every action'],
  'cat:tools': ['Tools', 'Tool adapters available to workflows'],
  'cat:functions': ['Functions', 'Built-in data/glue functions'],
  'cat:subagents': ['Sub-agents', 'External AI agent CLIs'],
  'cat:cloud': ['Cloud & Storage', 'Provisioning + object-storage providers'],
  'cat:skills': ['Skills', 'Bug-hunting playbooks (RAG) — search to preview'],
  'cat:plugins': ['Plugins', 'Loaded extension plugins'],
  llm: ['LLM Playground', 'Live agent console — realtime tokens, tool calls, and activity'],
  settings: ['Settings', 'Runtime configuration (secrets redacted)'],
};
function buildNav() {
  const nav = $('nav'); nav.replaceChildren();
  for (const g of NAV) {
    nav.append(el('div', { class: 'navgroup', text: g.group }));
    for (const it of g.items) {
      const n = el('div', { class: 'nav', on: () => navigate(it.id) },
        el('span', { class: 'ic', text: it.ic }), el('span', { text: it.label }));
      n.dataset.id = it.id;
      nav.append(n);
    }
  }
}
function navigate(id) {
  state.view = id;
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  const [t, d] = TITLES[id] || [id, ''];
  $('page-title').textContent = t; $('page-desc').textContent = d;
  render();
}

async function render() {
  const v = state.view, main = $('view');
  main.replaceChildren(el('div', { class: 'empty', text: 'loading…' }));
  try {
    if (v === 'dashboard') return await renderDashboard(main);
    if (v === 'runs') return await renderRuns(main);
    if (v === 'workflows') return await renderWorkflows(main);
    if (v === 'findings') return await renderFindings(main);
    if (v === 'workspaces') return await renderWorkspaces(main);
    if (v === 'events') return await renderEvents(main);
    if (v === 'llm') return renderLLM(main);
    if (v === 'settings') return await renderSettings(main);
    if (v.startsWith('cat:')) return await renderCatalog(main, v.slice(4));
  } catch (e) {
    main.replaceChildren(el('div', { class: 'empty', text: 'error: ' + e.message }));
  }
}

// ---- views ----------------------------------------------------------------
async function renderDashboard(main) {
  const [stats, runs] = await Promise.all([api('/api/stats'), api('/api/runs')]);
  main.replaceChildren();
  const cards = el('div', { class: 'grid stat-row' });
  cards.append(statCard('Runs', stats.runs, ''), statCard('Findings', stats.findings, ''));
  const byStatus = stats.findings_by_status || {};
  if (byStatus.confirmed) cards.append(statCard('confirmed', byStatus.confirmed, 'confirmed'));
  if (byStatus.suspected) cards.append(statCard('suspected', byStatus.suspected, 'suspected'));
  for (const sev of ['critical', 'high', 'medium', 'low', 'info']) {
    const n = (stats.findings_by_severity || {})[sev] || 0;
    if (n) cards.append(statCard(sev, n, sev));
  }
  main.append(cards);
  const recentHead = el('div', { class: 'row', style: 'margin:18px 0 8px' },
    el('h2', { style: 'margin:0', text: 'Recent runs' }),
    el('button', { class: 'small', style: 'margin-left:auto', text: '▷ New Scan', on: () => openNewScanDrawer() }));
  main.append(recentHead);
  main.append(runsTable(runs.slice(0, 10)));
}
function statCard(label, n, cls) {
  return el('div', { class: 'stat ' + cls }, el('div', { class: 'n', text: String(n) }), el('div', { class: 'l', text: label }));
}

async function renderRuns(main) {
  const ws = await api('/api/workspaces').catch(() => []);
  main.replaceChildren();
  const bar = el('div', { class: 'row', style: 'margin-bottom:12px' });
  const sel = el('select');
  sel.append(el('option', { value: '', text: 'all workspaces' }));
  for (const w of ws) sel.append(el('option', { value: w.workspace || '', text: `${w.workspace || '-'} (${w.runs})` }));
  sel.value = state.wsFilter;
  sel.onchange = () => { state.wsFilter = sel.value; renderRuns(main); };
  bar.append(sel, el('button', { style: 'margin-left:auto', text: '▷ New Scan', on: () => openNewScanDrawer() }));
  main.append(bar);
  const runs = await api('/api/runs' + (state.wsFilter ? '?workspace=' + encodeURIComponent(state.wsFilter) : ''));
  main.append(runsTable(runs));
}
function runsTable(runs) {
  return renderTable([
    { label: 'Workflow', key: 'workflow' },
    { label: 'Status', render: r => badge(r.status) },
    { label: 'Target', key: 'target' },
    { label: 'Workspace', render: r => el('span', { class: 'chip', text: r.workspace || '-' }) },
    { label: 'Run', key: 'run_id' },
    { label: 'When', key: 'created_at' },
  ], runs, 'no runs yet', r => openRunDrawer(r.run_id));
}

async function renderWorkflows(main) {
  const list = await api('/api/workflows');
  main.replaceChildren();
  const wrap = el('div', { style: 'display:grid;grid-template-columns:260px 1fr;gap:18px' });
  const left = el('div');
  for (const w of list) {
    const item = el('div', { class: 'item' + (w.name === state.wf ? ' active' : '') },
      el('div', { text: w.name }), el('div', { class: 'sub', text: `${w.steps} step(s)` }));
    item.onclick = () => selectWorkflow(w.name, right);
    left.append(item);
  }
  const right = el('div');
  wrap.append(left, right);
  main.append(wrap);
  if (state.wf) selectWorkflow(state.wf, right);
  else right.append(el('div', { class: 'empty', text: 'select a workflow to view + run it' }));
}
async function selectWorkflow(name, right) {
  state.wf = name;
  document.querySelectorAll('#view .item').forEach(n => n.classList.toggle('active',
    n.firstChild && n.firstChild.textContent === name));
  right.replaceChildren(el('div', { class: 'empty', text: 'loading…' }));
  const wf = await api('/api/workflows/' + encodeURIComponent(name));
  right.replaceChildren();
  right.append(el('h2', { text: wf.name }));
  if (wf.description) right.append(el('div', { class: 'desc', style: 'margin-bottom:10px', text: wf.description }));
  const bar = el('div', { class: 'row', style: 'margin-bottom:12px' });
  const target = el('input', { type: 'text', placeholder: 'target (e.g. example.com)' });
  const noai = el('input', { type: 'checkbox' });
  const runBtn = el('button', { text: '▷ Run' });
  runBtn.onclick = () => startRun(name, target.value, noai.checked).catch(e => alert(e.message));
  bar.append(target, el('label', { class: 'chk' }, noai, el('span', { text: 'no-ai' })), runBtn);
  right.append(bar);

function renderLLM(main) {
  main.replaceChildren();
  const wrap = el('div', { class: 'pg' });
  const col = el('div');
  const side = el('div', { class: 'side' });
  wrap.append(col, side);
  main.append(wrap);

  // ---- input card ----------------------------------------------------------
  const card = el('div', { class: 'card pad' });
  const ta = el('textarea', { placeholder: 'Ask Saarthi to hunt, analyze, or plan — e.g. "recon example.com and summarize the attack surface". Enable tools below to let it act.' });
  const toolWrap = el('div', { class: 'tool-chk', style: 'margin-top:10px' });
  const toolBoxes = {};
  for (const t of AI_TOOLS) {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = !!t.on;
    toolBoxes[t.id] = cb;
    toolWrap.append(el('label', { title: t.desc }, cb, el('span', { text: t.label })));
  }
  const skillsCb = el('input', { type: 'checkbox' }); skillsCb.checked = true;
  const iters = el('input', { type: 'text', value: '16', style: 'width:52px;min-width:0;flex:none' });
  const send = el('button', { text: 'Send' });
  const stop = el('button', { class: 'secondary small', text: '■ Stop' }); stop.disabled = true;
  const ctrls = el('div', { class: 'row', style: 'margin-top:10px' },
    el('label', { class: 'chk', title: 'Ground the agent in your ~/.saarthi2/skills playbooks as instructions' }, skillsCb, el('span', { text: 'use my skills' })),
    el('label', { class: 'chk' }, el('span', { text: 'max steps' }), iters),
    el('div', { style: 'margin-left:auto' }), stop, send);
  card.append(ta, el('div', { class: 'desc', style: 'margin-top:10px', text: 'Tools the agent may call:' }), toolWrap, ctrls);
  col.append(card);

  // ---- answer + live log ---------------------------------------------------
  const outCard = el('div', { class: 'card pad', style: 'margin-top:14px' });
  outCard.append(el('div', { class: 'sec-title', style: 'margin-top:0', text: 'Answer' }));
  const answer = el('pre', { class: 'ai-body pg-answer', text: '' });
  outCard.append(answer);
  outCard.append(el('div', { class: 'sec-title', text: 'Live log' }));
  const logBox = el('div', { class: 'pg-log' });
  logBox.append(el('span', { class: 'ln info', text: 'Ready. Type a prompt and hit Send to watch the agent work in realtime.' }));
  outCard.append(logBox);
  col.append(outCard);

  // ---- side pane: agent status + activity ----------------------------------
  const stModel = el('span', { class: 'v', text: '…' });
  const stStatus = el('span', { class: 'v' });
  const stIter = el('span', { class: 'v', text: '—' });
  const stTool = el('span', { class: 'v' });
  const stCalls = el('span', { class: 'v', text: '0' });
  const stElapsed = el('span', { class: 'v', text: '0.0s' });
  const strow = (k, v) => el('div', { class: 'st-row' }, el('span', { class: 'k', text: k }), v);
  const agentCard = el('div', { class: 'card pad', style: 'margin-bottom:14px' });
  agentCard.append(el('h2', { style: 'margin-top:0', text: 'Agent' }),
    strow('Agent', el('span', { class: 'v', text: 'Saarthi' })),
    strow('Model', stModel), strow('Status', stStatus), strow('Step', stIter),
    strow('Running tool', stTool), strow('Tool calls', stCalls), strow('Elapsed', stElapsed));
  const actCard = el('div', { class: 'card pad' });
  actCard.append(el('h2', { style: 'margin-top:0', text: 'Activity' }));
  const actList = el('div');
  actCard.append(actList);
  side.append(agentCard, actCard);
  api('/api/settings').then(s => { stModel.textContent = s.ollama_model || '(unknown)'; }).catch(() => {});

  // ---- runtime state -------------------------------------------------------
  let controller = null, timer = null, t0 = 0, callCount = 0, liveBuf = '', pendingItem = null, hasActivity = false;
  const setStatus = (cls, text) => stStatus.replaceChildren(el('span', { class: 'dot ' + cls }), el('span', { text }));
  const setTool = (cls, text) => stTool.replaceChildren(el('span', { class: 'dot ' + cls }), el('span', { text }));
  const logLine = (cls, text) => { logBox.append(el('span', { class: 'ln ' + (cls || ''), text })); logBox.scrollTop = logBox.scrollHeight; };
  const clip = (s, n) => { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '…' : s; };
  const jargs = (a) => { try { return clip(JSON.stringify(a), 120); } catch { return ''; } };
  const oneline = (s) => clip(String(s || '').replace(/\s+/g, ' ').trim(), 170);
  const resetActivity = () => { hasActivity = false; actList.replaceChildren(el('div', { class: 'empty', text: 'no tool activity yet' })); };
  const stopTimer = () => { if (timer) { clearInterval(timer); timer = null; } };

  function handleEvent(ev) {
    switch (ev.type) {
      case 'start':
        setStatus('run', 'running');
        logLine('info', `▶ agent started — tools: ${ev.tools && ev.tools.length ? ev.tools.join(', ') : 'none'} · max ${ev.max_iterations} steps`);
        break;
      case 'iteration':
        stIter.textContent = String(ev.n);
        logLine('info', `— step ${ev.n} —`);
        break;
      case 'token':
        liveBuf += ev.content; answer.textContent = liveBuf; answer.scrollTop = answer.scrollHeight;
        break;
      case 'note':
        logLine('think', ev.message);
        break;
      case 'assistant':
        break; // full turn text — already rendered live via tokens
      case 'tool_call': {
        if (liveBuf.trim()) logLine('think', '💭 ' + oneline(liveBuf));
        liveBuf = ''; answer.textContent = '';
        callCount++; stCalls.textContent = String(callCount);
        setTool('run', ev.name);
        logLine('tool', `🔧 ${ev.name}(${jargs(ev.arguments)})`);
        if (!hasActivity) { actList.replaceChildren(); hasActivity = true; }
        const dot = el('span', { class: 'dot run' });
        const item = el('div', { class: 'act-item run' },
          el('div', {}, dot, el('span', { class: 'tname', text: ev.name }), el('span', { class: 'titer', text: ` · step ${ev.iteration}` })),
          el('div', { class: 'targs', text: jargs(ev.arguments) }));
        actList.insertBefore(item, actList.firstChild);
        pendingItem = { item, dot };
        break;
      }
      case 'tool_result':
        setTool('idle', '—');
        logLine(ev.ok ? 'ok' : 'err', `${ev.ok ? '✓' : '✗'} ${ev.name}: ${oneline(ev.content)}`);
        if (pendingItem) {
          pendingItem.item.className = 'act-item ' + (ev.ok ? 'ok' : 'err');
          pendingItem.dot.className = 'dot ' + (ev.ok ? 'ok' : 'err');
          pendingItem.item.append(el('div', { class: 'targs', text: (ev.ok ? '→ ' : '⚠ ') + oneline(ev.content) }));
          pendingItem = null;
        }
        break;
      case 'final':
        if (ev.answer) { liveBuf = ''; answer.textContent = ev.answer; }
        setStatus('ok', 'done'); setTool('idle', '—');
        logLine('ok', `✓ done — ${ev.stopped_reason} (${ev.iterations} step${ev.iterations === 1 ? '' : 's'})`);
        break;
      case 'error':
        setStatus('err', 'error');
        logLine('err', '✗ ' + ev.message);
        if (!answer.textContent) answer.textContent = ev.message + '\n\nStart Ollama (`ollama serve`) and pull the model, then retry.';
        break;
    }
  }

  async function runStream() {
    const prompt = ta.value.trim();
    if (!prompt) return;
    const tools = AI_TOOLS.filter(t => toolBoxes[t.id].checked).map(t => t.id);
    const maxIter = Math.max(1, Math.min(40, parseInt(iters.value, 10) || 16));
    answer.textContent = ''; logBox.replaceChildren(); resetActivity();
    liveBuf = ''; callCount = 0; pendingItem = null;
    stCalls.textContent = '0'; stIter.textContent = '—';
    setStatus('run', 'running'); setTool('idle', '—');
    if (!tools.length) logLine('err', '⚠ No tools enabled — the agent can only talk, not hunt. Tick run_scan / http_get / search_skills, then Send.');
    send.disabled = true; stop.disabled = false;
    t0 = performance.now();
    timer = setInterval(() => { stElapsed.textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's'; }, 100);
    controller = new AbortController();
    try {
      const res = await fetch('/api/llm/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, tools, skills: skillsCb.checked, max_iterations: maxIter }),
        signal: controller.signal,
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let sep;
        while ((sep = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, sep); buf = buf.slice(sep + 2);
          const line = frame.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
          if (ev.type !== 'done') handleEvent(ev);
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        setStatus('err', 'error'); logLine('err', 'stream error: ' + e.message);
        if (!answer.textContent) answer.textContent = 'LLM unavailable: ' + e.message + '\n\nStart Ollama (`ollama serve`) and pull the model.';
      }
    } finally {
      stopTimer(); setTool('idle', '—'); pendingItem = null;
      send.disabled = false; stop.disabled = true; controller = null;
      loadStats();
    }
  }

  send.onclick = runStream;
  stop.onclick = () => { if (controller) controller.abort(); setStatus('idle', 'stopped'); logLine('info', '■ stopped by user'); };
  ta.onkeydown = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runStream(); };
  setStatus('idle', 'idle'); setTool('idle', '—'); resetActivity();
}

  // username, password), which the vuln-confirm workflow uses to log in first.

    if (username.value.trim()) vars.username = username.value.trim();
    if (password.value) vars.password = password.value;
    for (const line of extraVars.value.split('\n')) {

  auth.append(agrid);
  form.append(auth, el('div', { class: 'row', style: 'margin-top:14px' }, run));

function renderRunLive(live, d) {
  live.replaceChildren();
  const head = el('div', { class: 'row', style: 'margin:6px 0 10px' });
  if (d.run) head.append(el('span', { style: 'font-weight:700', text: d.run.workflow }), badge(d.run.status));
  if (d.run && d.run.workspace) head.append(el('span', { class: 'chip', text: d.run.workspace }));
  if (d.run && d.run.target) head.append(el('span', { class: 'chip', text: d.run.target }));
  live.append(head);

  live.append(renderTable([
    { label: 'Step', key: 'step_id' },
    { label: 'Status', render: s => badge(s.status) },
    { label: 'ms', key: 'duration_ms' },
    { label: 'Detail', render: s => el('span', { text: s.error || (s.exit_code != null ? 'exit=' + s.exit_code : '') }) },
  ], d.steps, 'starting…'));

  const withOut = (d.steps || []).filter(s => s.output && s.output.trim());
  live.append(el('div', { class: 'sec-title', text: 'Output' }));
  if (!withOut.length) {
    const done = d.run && d.run.status !== 'running' && !d.running;
    live.append(el('div', { class: 'empty', text: done ? 'No output captured (re-run to capture).' : 'waiting for output…' }));
  } else for (const s of withOut) {
    const pre = el('pre', { class: 'out', text: s.output });
    const label = el('div', { class: 'out-label' }, el('span', { text: s.step_id + ' ' }), badge(s.status));
    if (s.evidence_path) {
      const full = el('a', { class: 'link', text: '⤢ full' });
      full.onclick = async () => { try { const r = await api(`/api/runs/${d.run.run_id}/steps/${encodeURIComponent(s.step_id)}/output`); if (r.output) pre.textContent = r.output; } catch (e) {} };
      label.append(full);
    }
    live.append(label, pre);
  }

  if (d.findings && d.findings.length) {
    live.append(el('div', { class: 'sec-title', text: `Findings (${d.findings.length})` }));
    live.append(renderTable([
      { label: 'Status', render: f => statusPill(f.status) },
      { label: 'Sev', render: f => sevPill(f.severity) },
      { label: 'Class', render: f => f.vuln_class || f.rule_id || '' },
      { label: 'Message', key: 'message' }, { label: 'Location', key: 'location' },
    ], d.findings, '', f => openFindingDrawer(f)));
  }
}

async function showReport(runId, container) {
  let box = container.querySelector('.rep-box');
  if (!box) { box = el('div', { class: 'rep-box' }); container.append(box); }
  box.replaceChildren(el('div', { class: 'h', text: '📄 Report' }), el('pre', { class: 'ai-body', text: 'loading…' }));
  const body = box.querySelector('.ai-body');
  try {
    const r = await api(`/api/runs/${runId}/report`);
    body.textContent = r.content;
    const dl = el('a', { class: 'link', text: '⤓ download .md' });
    dl.onclick = () => { const u = URL.createObjectURL(new Blob([r.content], { type: 'text/markdown' })); const a = el('a', { href: u, download: runId + '.md' }); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(u); };
    box.querySelector('.h').append(' ', dl);
  } catch (e) { body.textContent = 'report unavailable: ' + e.message; }
}

async function aiAnalyze(runId, container) {
  let box = container.querySelector('.ai-box');
  if (!box) { box = el('div', { class: 'ai-box' }); container.append(box); }
  box.replaceChildren(el('div', { class: 'h', text: '🧠 AI Analysis' }), el('pre', { class: 'ai-body', text: 'analyzing… (needs Ollama running)' }));
  const body = box.querySelector('.ai-body');
  let d; try { d = await api('/api/runs/' + runId); } catch (e) { body.textContent = e.message; return; }
  const outputs = (d.steps || []).filter(s => s.output).map(s => `## ${s.step_id} (${s.status})\n${s.output}`).join('\n\n').slice(0, 12000);
  const findings = (d.findings || []).map(f => `- [${f.severity}] ${f.tool} ${f.rule_id}: ${f.message} @ ${f.location}`).join('\n') || 'none recorded';
  const prompt = `You are a security analyst reviewing an AUTHORIZED assessment of ${(d.run && d.run.target) || ''} ` +
    `(workflow: ${(d.run && d.run.workflow) || ''}).\n\nTool outputs:\n${outputs}\n\nRecorded findings:\n${findings}\n\n` +
    `Summarize the attack surface, the most notable results, and the 3-5 highest-value next steps. Base your answer only on the evidence. Be concise.`;
  try {
    const r = await api('/api/llm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, skills: true }) });
    body.textContent = r.answer || '(empty response)';
  } catch (e) { body.textContent = 'AI analysis unavailable: ' + e.message + '\n\nStart Ollama and pull the model, then retry.'; }
}

// ---- header stats ---------------------------------------------------------
async function loadStats() {
  try {
    const s = await api('/api/stats');
    const strip = $('topstats');
    strip.replaceChildren(el('span', { class: 'chip', text: `${s.runs} runs` }), el('span', { class: 'chip', text: `${s.findings} findings` }));
    for (const sev of ['critical', 'high', 'medium', 'low']) {
      const n = (s.findings_by_severity || {})[sev]; if (n) strip.append(el('span', { class: 'sev sev-' + sev, text: `${sev} ${n}` }));
    }
  } catch (e) { /* best effort */ }
}

$('new-scan').onclick = () => openNewScanDrawer(state.wf);
$('global-refresh').onclick = () => { loadStats(); render(); };
buildNav();
navigate('dashboard');
loadStats();
</script>
